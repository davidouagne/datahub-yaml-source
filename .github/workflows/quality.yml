name: Quality

# Implements the contract documented in spec/spec-process-cicd-quality.md.
# Keep the two in sync: any change to triggers, jobs, or gates here
# should update that spec first, per its Change Management section.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    # Blocking. This job's name is the required status check wired into
    # branch protection for `main` -- keep it stable ("ruff").
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # Full history + tags so hatch-vcs derives the real version
        # (pyproject.toml [tool.hatch.version]); a shallow clone would
        # leave every install at the 0.0.0 fallback.
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # ruff + mypy are declared in pyproject.toml's `dev` dependency
      # group, so the tool versions CI uses are the same ones `uv sync`
      # gives a contributor locally -- no separate tool-install step, no
      # drift.
      - name: Install (dev group)
        run: uv sync --frozen --group dev

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check --diff .

  mypy:
    # Blocking (issue #13). The mypy baseline was driven to zero, so a new
    # type error now fails the build. This job's name is a required status
    # check wired into branch protection for `main` -- keep it stable ("mypy").
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # Full history + tags so hatch-vcs derives the real version
        # (pyproject.toml [tool.hatch.version]); a shallow clone would
        # leave every install at the 0.0.0 fallback.
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (dev group)
        run: uv sync --frozen --group dev

      - name: mypy
        run: uv run mypy
