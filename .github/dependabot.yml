# Dependency updates for a single-maintainer repo. Patch-level bumps (any
# dependency) and minor-level bumps to dev-only and transitive dependencies
# auto-merge once required checks are green (ADR-0003, issue #51,
# .github/workflows/dependabot-auto-merge.yml); majors and minor bumps to
# direct production dependencies still require manual review.
#
# Grouping (matches the sibling repo datahub-healthdcat-ap-exporter's
# dependabot.yml as of 2026-09-15, after the maintainer compared the two
# directly): on `uv`, every dev-only bump -- patch, minor, *or major* --
# is grouped into one PR (`dev-dependencies`); production bumps are only
# grouped at minor/patch, so a production major still arrives as its own
# individually-reviewed PR. Unlike the sibling, production patch and minor
# bumps go into separate groups (`prod-patch` / `prod-minor`, spec v1.8):
# a minor bump to a direct production dependency is never
# auto-merge-eligible, and in a combined group it would hold every patch
# hostage to manual review (PR #107). On `github-actions`, every
# bump of any level is grouped into one PR (`actions`) -- unlike `uv`,
# there is no separate "majors stand alone" carve-out here, mirroring the
# sibling exactly. A dev-dependencies group that happens to bundle a major
# alongside a patch is still correctly refused auto-merge as a whole: the
# eligibility check in dependabot-auto-merge.yml evaluates every member of
# a grouped PR independently (see that spec's VLD-007), so one ineligible
# entry blocks the entire group's auto-merge, not just its own bump.
#
# `cooldown` (uv only, matches the sibling): a newly-published version
# must be at least 3 days old before Dependabot opens a PR for it -- lets
# a bad release get yanked/patched upstream before this repo ever sees it.
#
# Design contract: spec/spec-process-cicd-dependabot.md
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Default `allow` is direct dependencies only, so a vulnerable
    # transitive pin in uv.lock (e.g. multidict via aiohttp, issue #96)
    # was never bumped -- and Dependabot security updates only fire when
    # GitHub raises an alert, which it failed to do there. `all` makes the
    # weekly run cover indirect deps too. Deliberate divergence from the
    # sibling repo (spec v1.7).
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
    assignees:
      - "davidouagne"
    # `deps` for production (transitives included), `build` for dev --
    # matches the sibling repo since 2026-10-26. `deps` gets its own
    # "Dependencies" changelog section (release-please-config.json), so
    # runtime bumps no longer blend into dev tooling under "Build System".
    # No scope: the type already tells production from dev.
    commit-message:
      prefix: "deps"
      prefix-development: "build"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      prod-patch:
        dependency-type: "production"
        update-types:
          - "patch"
      prod-minor:
        dependency-type: "production"
        update-types:
          - "minor"
    # No `ignore` entry for acryl-datahub majors. pyproject.toml deliberately
    # caps it at <1.8 (undeprecated breaks in the still-experimental
    # datahub.sdk.* surface -- see the comment there). Dependabot will
    # open a PR to lift that cap; the by-hand review every dependency PR
    # already gets is the intended gate, and an `ignore` would only hide
    # a bump the maintainer wants to see queued. `acryl-datahub` is a
    # production dependency, so this cap is never swept into a group --
    # `prod-patch` / `prod-minor` only cover patch / minor.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "davidouagne"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
