# Dependency updates for a single-maintainer repo. Patch-level bumps (any
# dependency) and minor-level bumps to dev-only dependencies auto-merge
# once required checks are green (ADR-0003, issue #51,
# .github/workflows/dependabot-auto-merge.yml); majors and minor bumps to
# production dependencies still require manual review. Minor + patch
# bumps are grouped into one PR per ecosystem to keep that manual/review
# queue short; major bumps arrive as individual PRs so each breaking
# change is reviewed on its own.
#
# Design contract: spec/spec-process-cicd-dependabot.md
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # No `ignore` entry for acryl-datahub majors. pyproject.toml deliberately
    # caps it at <1.8 (undeprecated breaks in the still-experimental
    # datahub.sdk.* surface -- see the comment there). Dependabot will
    # open a PR to lift that cap; the by-hand review every dependency PR
    # already gets is the intended gate, and an `ignore` would only hide
    # a bump the maintainer wants to see queued.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
