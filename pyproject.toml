[project]
name = "datahub-yaml-source"
description = "DataHub ingestion source that reads declarative YAML metadata files."
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "David Ouagne", email = "david.ouagne@aphp.fr" }]
keywords = ["datahub", "metadata", "ingestion", "yaml", "metadata-as-code", "data-catalog"]
classifiers = [
    # An untagged pre-1.0 connector maintained by one person, outside the
    # DataHub Ingestion team -- mirrors yaml_source.py's @support_status.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# acryl-datahub>=1.7.0 itself requires Python >=3.10 (its PyPI
# classifiers list only 3.10/3.11/3.12) -- this floor tracks that,
# not an independent choice; CI matrices 3.10-3.12 accordingly.
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # >=1.6.0 for the SDK V2 constructor kwargs the cross-cutting aspect
    # helpers in builders/common.py depend on (e.g. DataFlow/DataJob's
    # `parent_container=`, `links=`, `structured_properties=`).
    #
    # Floor >=1.7.0.9: the (still ExperimentalWarning) datahub.sdk.*
    # surface this connector builds on took two undeprecated breaks
    # inside the 1.7.0.x series, both absorbed in issue #12 --
    #   * 1.7.0.5: SemanticModel membership no longer accepts bare
    #     dataset URNs; builders/semantic.py now builds
    #     SemanticModelDataset (alias + resolved schema);
    #   * 1.7.0.8: the SupportStatus enum was renamed
    #     (CERTIFIED/INCUBATING/TESTING -> ALPHA/BETA/GA);
    #     yaml_source.py's @support_status now uses ALPHA.
    # Upper bound <1.8: the datahub.sdk.* surface is still
    # ExperimentalWarning-flagged, so a minor bump can break again.
    "acryl-datahub>=1.7.0.9,<1.8",
    "pyyaml>=6.0",
    # models.py/loader.py/yaml_source_config.py import pydantic directly
    # for the config schema and validation. Only ever a transitive dep
    # today (acryl-datahub itself requires pydantic>=2.4.0,<3.0.0
    # unconditionally); declared explicitly so our own use of it isn't
    # silently dependent on that staying true. Same range as upstream's
    # own floor, to avoid a resolver conflict.
    "pydantic>=2.4.0,<3.0.0",
    # loader.py/yaml_source.py import requests for the http(s):// 'path'
    # code path (a normal top-level import -- unlike boto3/GitPython,
    # requests needs no optional extra, so there's no lazy-import reason
    # to defer it). Only ever a *two-hop* transitive dep today
    # (acryl-datahub unconditionally requires requests_file, which in
    # turn requires requests>=1.0.0 -- an essentially unconstrained
    # floor); declared explicitly with a floor actually exercised by
    # our own requests.get(..., stream=True)/requests.head(...) calls.
    "requests>=2.28.0,<3",
]

[project.urls]
Homepage = "https://github.com/davidouagne/datahub-yaml-source"
Issues = "https://github.com/davidouagne/datahub-yaml-source/issues"
Changelog = "https://github.com/davidouagne/datahub-yaml-source/releases"

[project.optional-dependencies]
# GitInfo.clone() (datahub.configuration.git) lazily imports GitPython;
# it's in the base acryl-datahub wheel but the dependency isn't, so
# 'git_info' in a recipe needs this extra installed.
git = ["GitPython>=3.1.37,<4"]
# 'aws_connection' + an s3:// entry in 'path' needs boto3, which DataHub's
# AwsConnectionConfig (datahub.ingestion.source.aws.aws_common) hard-imports
# at module level -- lazily imported only inside YamlSource's S3 code paths,
# so local-only/git-only/http-only recipes never need this extra.
s3 = ["boto3>=1.35.0,<2"]

[project.entry-points."datahub.ingestion.source.plugins"]
yaml = "datahub_yaml_source.yaml_source:YamlSource"

[dependency-groups]
# PEP 735 -- dev-only tooling, never published as a package extra.
# Installed by default by `uv sync`.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "deepdiff>=6.0.0",
    "jsonschema>=4.0.0",
    "GitPython>=3.1.37,<4",
    "boto3>=1.35.0,<2",
    # Lint/format and type-check, run by .github/workflows/quality.yml
    # (see spec/spec-process-cicd-quality.md). Ruff's lint rules and
    # formatter shift between minors, so it carries an upper bound;
    # local and CI must agree on the exact ruleset. 0.12..0.16 is a
    # clean range for this tree (0.16 added Markdown code-block
    # formatting, hence the `*.md` exclude in [tool.ruff]).
    "ruff>=0.12,<0.17",
    "mypy>=1.17",
    "types-PyYAML>=6.0",
    # Weekly SCA scan against the locked dependency tree, run by
    # .github/workflows/audit.yml (see spec/spec-process-cicd-audit.md).
    "pip-audit>=2.7",
    # THROWAWAY -- verification-only for spec/spec-process-cicd-dependency-review.md
    # VLD-002/VLD-003. Pillow 9.0.0 carries known high/critical-severity CVEs;
    # chess (python-chess) is GPL-3.0-or-later-licensed. Never merge this.
    "Pillow==9.0.0",
    "chess>=1.0,<2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The package version is not written anywhere -- hatch-vcs (a thin wrapper
# around setuptools-scm) derives it from Git tags at build time. See
# spec/spec-process-cicd-quality.md / spec-process-cicd-ci.md for the CI
# `fetch-depth: 0` this needs.
source = "vcs"

[tool.hatch.version.raw-options]
# no-guess-dev: an untagged commit is X.Y.Z.post1.devN (explicitly "after
#   the last release"), not X.Y.(Z+1).devN which would imply an unreleased
#   future version that may never ship.
# no-local-version: drop the +g<hash> local segment -- PyPI / TestPyPI
#   reject local versions, so any non-tag build (e.g. a CI dev upload)
#   stays valid. Clean tag builds are unaffected either way.
# fallback_version: a build from a source archive with no .git and no
#   SETUPTOOLS_SCM_PRETEND_VERSION degrades to 0.0.0 instead of hard-failing.
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/datahub_yaml_source"]

[tool.hatch.build.targets.sdist]
# Mirrors the exclusions the old MANIFEST.in carried for setuptools-scm's
# file finder, which otherwise sweeps every Git-tracked path into the
# sdist. Keep the sdist to what a consumer of the package actually needs;
# the rest lives on GitHub.
#
# `.gitignore` is deliberately NOT listed here: hatchling ships it in the
# sdist regardless of `exclude` (verified empirically -- unlike every
# other entry below, it stays in the built tarball). It's harmless
# (no secrets, just ignore patterns), so this is accepted rather than
# worked around with a build hook.
exclude = [
    "tests",
    "docs",
    "spec",
    "scripts",
    ".github",
    ".claude",
    "AGENTS.md",
    "CLAUDE.md",
    "_PLANNING.md",
    "skills-lock.json",
    "bash.exe.stackdump",
    "codecov.yml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
# Ruff's scope here is first-party Python only. Since 0.16 `ruff format` also
# reformats ```python blocks inside Markdown; the illustrative snippets in
# `_PLANNING.md` are hand-shaped for reading, so keep prose docs out.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# pyflakes/pycodestyle errors (E, F), import sorting (I), pyupgrade (UP),
# flake8-bugbear (B), flake8-comprehensions (C4), flake8-simplify (SIM),
# Ruff's own rules (RUF), plus annotation-completeness (ANN) and pylint
# (PL) -- matches the sibling repo's posture (issue #55).
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "PL"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: an unused import is the point.
"__init__.py" = ["F401"]
# Test fixtures embed full DataHub URNs and JSON blobs as string literals;
# these are legitimately long and not meaningfully breakable. The formatter
# still enforces 100 cols on everything it can reflow. ANN/PL (issue #55)
# are scoped to `src/` only, mirroring `[tool.mypy] files = ["src"]` below --
# annotating every test function and script would be a much larger, separate
# undertaking (387 violations outside src/ vs. the 48 issue #55 scoped and
# fixed inside it) with no real safety payoff (mypy already checks src/ only).
"tests/**" = ["E501", "ANN", "PL"]
"scripts/**" = ["ANN", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["datahub_yaml_source"]

[tool.mypy]
# Blocking (issue #13) -- the quality workflow runs this job with no
# continue-on-error. Scope is the package itself (issue #55: strict = true,
# scoped to src/ only); tests/ and scripts/ are left out of `files`, so the
# tests.* override below is currently a no-op in practice -- kept anyway
# (mirroring the sibling repo) so `files` can later be widened to include
# tests/ without silently demanding full annotation coverage there too.
files = ["src"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Doubles/fixtures typed "well enough": a safety net without demanding
# every test_* function be annotated. See the `files` note above.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# acryl-datahub ships partial/absent type information; its generated
# metadata classes in particular are untyped. Don't let that drown the
# signal from our own code.
module = ["datahub.*", "deepdiff.*"]
ignore_missing_imports = true
