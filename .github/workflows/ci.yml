name: CI

# Implements the contract documented in spec/spec-process-cicd-ci.md.
# Keep the two in sync: any change to triggers, jobs, or gates here
# should update that spec first, per its Change Management section.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions REPLACE the workflow-level grant, they do not
    # merge -- so `contents: read` is restated here alongside the
    # `id-token: write` that Codecov's OIDC upload needs. Only this job
    # gets it; see spec/spec-process-cicd-codecov.md (SEC-002) and the
    # Security Controls note in spec/spec-process-cicd-ci.md.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # acryl-datahub>=1.7.0 requires Python >=3.10 (its own PyPI
        # classifiers list only 3.10/3.11/3.12) -- this matrix mirrors
        # pyproject.toml's requires-python floor, it does not set it.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        # Full history + tags so hatch-vcs derives the real version
        # (pyproject.toml [tool.hatch.version]); a shallow clone would
        # leave every install at the 0.0.0 fallback.
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install (dev group + all extras)
        run: uv sync --frozen --group dev --extra git --extra s3

      # Unit + integration in one run: tests/unit includes
      # test_json_schema_generation.py / test_markdown_docs_generation.py,
      # which fail if docs/schema drift from models.py, and
      # tests/integration is the golden-file comparison. Never pass
      # --update-golden-files here -- that would make the golden gate
      # self-approving.
      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=datahub_yaml_source --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80

      # Reporting only -- Codecov never gates `main`; --cov-fail-under=80
      # above is the coverage gate. All three matrix legs upload, tagged by
      # Python version; Codecov merges them. OIDC auth (no CODECOV_TOKEN).
      # `fail_ci_if_error: false` + `if: always()`: a Codecov outage, or a
      # fork PR with no OIDC token, must never fail this job or `CI status`.
      # Contract: spec/spec-process-cicd-codecov.md
      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: false

  minimal-install-check:
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # Full history + tags so hatch-vcs derives the real version
        # (pyproject.toml [tool.hatch.version]); a shallow clone would
        # leave every install at the 0.0.0 fallback.
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.10"

      # Build the wheel and install it fresh, base dependencies only --
      # no `git` or `s3` extra, and no dev group. This is what an actual
      # consumer of the published package gets, not the workspace's own
      # editable/dev environment. `setup.py` used to document GitPython/
      # boto3 as lazily imported so a local-only recipe never needs them;
      # this job guards that contract.
      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a fresh venv (base only)
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check dist/*.whl

      - name: Verify optional extras are not eagerly imported
        run: |
          .venv-check/bin/python -c "
          import sys
          import datahub_yaml_source.yaml_source
          leaked = [m for m in ('boto3', 'git') if m in sys.modules]
          assert not leaked, f'optional extras imported eagerly: {leaked}'
          print('OK: no eager import of', ('boto3', 'git'))
          "

      - name: Verify the yaml source plugin registers
        run: |
          .venv-check/bin/datahub check plugins > /tmp/plugins.out
          cat /tmp/plugins.out
          # An enabled source is printed as a bare line; a source that fails
          # to import is listed as "yaml   (disabled)". Match the whole line
          # exactly so a disabled plugin is treated as a failure.
          grep -qx yaml /tmp/plugins.out || {
            echo "::error::the 'yaml' source is not registered (or is listed as disabled)"
            exit 1
          }

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [test, minimal-install-check]
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.minimal-install-check.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
