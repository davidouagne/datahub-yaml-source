# yaml-language-server: $schema=../../../../../docs/sources/yaml/schema/yaml-metadata.schema.json
kind: ASSERTION
id: ehr-patient-freshness-check
description: "The patient table must be refreshed within 24h"
sourceType: NATIVE
properties:
  name: "Freshness - patient"
assertion:
  type: FRESHNESS
  entityUrn: "urn:li:dataset:(urn:li:dataPlatform:postgres,ehr_public_patient,PROD)"
  freshnessType: DATASET_CHANGE
  scheduleType: CRON
  cron: "0 8 * * *"
  timezone: "UTC"
owners:
  owner: datahub
  type: TECHNICAL_OWNER
tags:
  - pii
---
kind: ASSERTION
id: warehouse-patient-row-count-check
description: "The warehouse copy must have at least as many rows as the source"
sourceType: NATIVE
properties:
  name: "Volume - patient row count"
assertion:
  type: VOLUME
  entityUrn: "urn:li:dataset:(urn:li:dataPlatform:duckdb,warehouse_raw_layer_patient,PROD)"
  volumeType: ROW_COUNT_TOTAL
  operator: GREATER_THAN_OR_EQUAL_TO
  value: 1
assertionNote: "Last checked green on 2026-08-14; row count was 1.48M."
---
kind: ASSERTION
id: warehouse-patient-uniqueness-check
description: "patient_id must be unique"
sourceType: NATIVE
properties:
  name: "Uniqueness - patient_id"
assertion:
  type: SQL
  entityUrn: "urn:li:dataset:(urn:li:dataPlatform:duckdb,warehouse_raw_layer_patient,PROD)"
  sqlType: METRIC
  statement: "SELECT COUNT(*) - COUNT(DISTINCT patient_id) FROM warehouse_raw_layer_patient"
  operator: EQUAL_TO
  value: 0
  changeType: ABSOLUTE
---
kind: INCIDENT
id: inc-patient-freshness-2026-08-15
type: FRESHNESS
title: Patient table missed its refresh window
description: The 08:00 CRON refresh of ehr_public_patient did not complete
priority: 1
entities:
  - "urn:li:dataset:(urn:li:dataPlatform:postgres,ehr_public_patient,PROD)"
status:
  state: ACTIVE
  stage: TRIAGE
  message: Investigating a warehouse outage
assignees:
  - datahub
source:
  type: ASSERTION_FAILURE
  sourceUrn: "urn:li:assertion:ehr-patient-freshness-check"
startedAt: 1830297600000
notes:
  - Warehouse outage confirmed at 08:05
tags:
  - pii
